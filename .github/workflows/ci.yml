name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no environment files are committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then echo "Committed env files found:"; echo "$tracked"; exit 1; fi
      - name: ADR status consistency (lesson L-002)
        run: |
          fail=0
          for f in docs/adr/[0-9]*.md; do
            [ -f "$f" ] || continue
            status=$(awk '/^## Status/{getline; print; exit}' "$f")
            case "$status" in
              Accepted*)
                if grep -nE '^Proposed:|\(proposed\)' "$f"; then
                  echo "::error file=$f::Accepted ADR still contains Proposed wording"; fail=1
                fi;;
            esac
          done
          exit $fail
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install (lockfile)
        working-directory: apps/mobile
        run: npm ci
      - name: Format
        working-directory: apps/mobile
        run: npm run format:check
      - name: Lint
        working-directory: apps/mobile
        run: npm run lint
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Test
        working-directory: apps/mobile
        run: npm test -- --ci
      - name: Build (expo export)
        working-directory: apps/mobile
        run: npm run export
