name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no environment files are committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then echo "Committed env files found:"; echo "$tracked"; exit 1; fi
      - name: Placeholder for stack checks
        run: echo "Add lockfile install, format, lint, typecheck, test, and build after scaffold approval (FND-02/FND-03)."
