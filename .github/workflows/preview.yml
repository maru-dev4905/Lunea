# PR preview on a real device (LUN-12, ADR-0008): publishes the app to EAS Update on a
# per-PR branch and comments a QR code that opens it in Expo Go.
# Policy is enforced by scripts/check-workflows.sh.
name: Preview
on:
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/preview.yml
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  update:
    # Secrets are never available to fork PRs; skip them explicitly instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that EXPO_TOKEN is set
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EXPO_TOKEN not set; skipping the device preview."
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # Install first: dependency install scripts must not see the Expo token.
      - if: steps.token.outputs.present == 'true'
        name: Install (lockfile)
        working-directory: apps/mobile
        run: npm ci
      - if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      # The branch name comes from the PR number only: PR branch names are external input.
      - if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action/preview@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          working-directory: apps/mobile
          command: eas update --auto --non-interactive --branch pr-${{ github.event.pull_request.number }}
          qr-target: expo-go
